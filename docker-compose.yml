services: # Different containers to compose
  nginx:
    image: nginx:alpine # docker hub image
    container_name: nginx # container name so its not random
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # mount the nginx.conf in terminal into the containers default.conf (which is what the container would use internally for nginx)
                                                    # Editing nginx.conf locally would change what the container uses.
    ports:
      - "80:80" # punches a hole between ec2 instance and container at port 80. http request -> ec2:80 /hole/ -> container:nginx -> ...
    networks:
      - my-network # communication from container <-> container. Every service on my-network can communicate with eachother internally.
    depends_on: # create container after flask container.
      - flask

  db:
    image: mariadb:11
    environment: # Below are somehow variables that areused to init database
      MARIADB_ROOT_PASSWORD: xkir23
      MARIADB_DATABASE: reconciliation_db
      MARIADB_USER: rec_user
      MARIADB_PASSWORD: xkir23
    networks: # Add this db service to the internal shared docker network for this compose ecosystem
      - my-network
    volumes:
      - db_data:/var/lib/mysql # Docker creates and manages a storage volume: "db_data" in /var/lib/docker/volumes/
                               # and mounts it to a folder: "/var/lib/mysql" inside the container
                               # so everything written in /var/lib/mysql in container is also written to db_data on EC2 vm.
      - ./src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql # /docker-entrypoint-initdb.d/ is a convention built into mysql:8 image. On first startup, run all .sql files in that folder (DDL, DML).
                                                                     # therefore take the init.sql file in the terminal and mount it to /docker-entrypoint-initdb.d/init.sql

  flask:
    build: # build an image from scratch instead of using pre buitl image
      context: ./
      dockerfile: Dockerfile
    container_name: flask
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: rec_user
      DB_PASSWORD: xkir23
      DB_NAME: reconciliation_db

    command: gunicorn --bind 0.0.0.0:5000 --workers 4 "app:app" # overrite CMD in Dockerfile
                                                                # Run 4 workers of the Flask app in app.py, listen for connections on :5000 (nginx will forward to that port from :80)
    networks: # join this container on the my-network and alias it
      my-network:
        aliases:
          - flask-app # alternative name for the Flask container within the my-network

    depends_on:
      - db

volumes:
  db_data:

networks:
  my-network:
